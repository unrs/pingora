name: Server benchmark

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: HTTP server framework matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: server-bench

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Docker Compose
        run: docker compose version

      - name: Run server benchmark
        run: |
          BENCH_SERVER_DURATION_MS=5000 \
          BENCH_SERVER_CONCURRENCY=16 \
          BENCH_SERVER_WARMUP_MS=500 \
          BENCH_SERVER_OUTPUT=server-benchmark.json \
          pnpm bench:server

      - name: Write summary
        if: always()
        run: |
          if ! jq -e '.results' server-benchmark.json >/dev/null 2>&1; then
            echo "server-benchmark.json is missing or invalid" >&2
            exit 1
          fi
          {
            echo '## HTTP server framework benchmark'
            echo
            echo 'Host: `'$(jq -c '.host' server-benchmark.json)'`'
            echo
            echo '| target | workload | req/s | p50 (ms) | p95 (ms) | p99 (ms) | cpu% | cgroup memory (MiB) | RSS (MiB) |'
            echo '| --- | --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |'
            jq -r '.results[] | .target as $target | .measurements[] | "| \($target) | \(.workload) | \(.rps) | \(.p50Ms) | \(.p95Ms) | \(.p99Ms) | \(.cpuPercent // "n/a") | \(.memoryMiB // "n/a") | \(.rssMiB // "n/a") |"' server-benchmark.json
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Dump container logs
        if: failure()
        run: docker compose -f bench/server/docker-compose.yml logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose -f bench/server/docker-compose.yml down

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-benchmark
          path: server-benchmark.json
          if-no-files-found: warn
