name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A publish that has started must finish: cancelling can leave some packages
  # on npm and others missing.
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEBUG: napi:*
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  release:
    name: Version or prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.state.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Changesets needs history for changelogs and the version PR branch.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read current version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Create release pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: release package(s)'
          pr-title: 'chore: release package(s)'
          # The native packages cannot be published by the action: they need a
          # four-target build matrix. This no-op lets the action expose whether
          # there were pending changesets, then the jobs below do the release.
          publish-script: pnpm run release:noop
          version-script: pnpm run version-packages
          create-github-releases: false
          push-git-tags: false

      - name: Decide whether this version needs a release
        id: state
        env:
          HAS_CHANGESETS: ${{ steps.changesets.outputs.has-changesets }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [ "${HAS_CHANGESETS}" != "false" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Pending changesets; the version pull request was created or updated."
            exit 0
          fi

          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            "https://registry.npmjs.org/pingora/${VERSION}")
          case "$status" in
            200)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "pingora@${VERSION} is already published."
              ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "pingora@${VERSION} is not published yet."
              ;;
            *)
              echo "npm registry answered ${status} for pingora@${VERSION}" >&2
              exit 1
              ;;
          esac

  build:
    name: Build ${{ matrix.target }}
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            host: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            host: macos-latest
          - target: aarch64-apple-darwin
            host: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build binding
        run: pnpm exec napi build --platform --release --target ${{ matrix.target }}

      - name: Upload binding
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-${{ matrix.target }}
          path: pingora.*.node
          if-no-files-found: error

      - name: Upload generated loader
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-binding
          path: |
            index.js
            index.d.ts
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs:
      - release
      - build
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed to push the release tag after a successful publish.
          persist-credentials: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Download generated loader
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-binding
          path: .

      - name: Assemble platform packages
        run: |
          pnpm exec napi create-npm-dirs
          pnpm exec napi artifacts

      - name: Publish platform packages
        # Trusted publishing (OIDC) authenticates each publish; no NPM_TOKEN.
        run: pnpm run publish:platforms

      - name: Add platform packages to the root manifest
        run: pnpm run prepare:root

      - name: Publish main package
        run: pnpm run publish:root

      - name: Create release tag
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists on origin."
            exit 0
          fi
          if ! git rev-parse --verify "${tag}" >/dev/null 2>&1; then
            git tag -a "${tag}" -m "${tag}"
          fi
          git push origin "${tag}"
