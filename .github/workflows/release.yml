name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A publish that has started must finish: cancelling can leave some packages
  # on npm and others missing.
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEBUG: napi:*
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  release:
    name: Version or prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      publish: ${{ steps.native-version.outputs.publish }}
      native: ${{ steps.native-version.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Changesets needs history for changelogs and the version PR branch.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install cargo-binstall
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-binstall

      - name: Install cargo-edit
        run: cargo binstall --no-confirm cargo-edit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update release pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit-message: 'chore: release packages'
          pr-title: 'chore: release packages'
          version-script: pnpm run version

      - name: Check native version on npm
        id: native-version
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          set -euo pipefail
          # Changesets decides which JS packages to publish. The only extra
          # decision here is whether the native artifacts must be rebuilt.
          echo "publish=true" >> "$GITHUB_OUTPUT"
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          encoded_name=${name//\//%2f}
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            "https://registry.npmjs.org/${encoded_name}/${version}")
          case "$status" in
            200)
              echo "${name}@${version} is already published; skipping native build."
              echo "native=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "${name}@${version} is not published; native build required."
              echo "native=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "npm registry answered ${status} for ${name}@${version}" >&2
              exit 1
              ;;
          esac

  build:
    name: Build ${{ matrix.target }}
    needs: release
    if: needs.release.outputs.native == 'true'
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-latest
            build-args: --use-napi-cross
          - target: aarch64-unknown-linux-gnu
            host: ubuntu-latest
            build-args: --use-napi-cross
          - target: x86_64-unknown-linux-musl
            host: ubuntu-latest
            build-args: -x
          - target: aarch64-unknown-linux-musl
            host: ubuntu-latest
            build-args: -x
          - target: x86_64-apple-darwin
            host: macos-latest
          - target: aarch64-apple-darwin
            host: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Zig
        if: contains(matrix.target, 'musl')
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build binding
        run: pnpm build ${{ matrix.build-args }} --target ${{ matrix.target }}
        env:
          TARGET_CC: clang
          TARGET_CXX: clang++

      - name: Upload binding
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-${{ matrix.target }}
          path: pingora.*.node
          if-no-files-found: error

      - name: Upload generated loader
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-binding
          path: |
            index.js
            index.d.ts
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs:
      - release
      - build
    if: always() && needs.release.outputs.publish == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download bindings
        if: needs.release.outputs.native == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Download generated loader
        if: needs.release.outputs.native == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-binding
          path: .

      - name: Assemble platform packages
        if: needs.release.outputs.native == 'true'
        run: |
          pnpm napi create-npm-dirs
          pnpm napi artifacts

      - name: Publish platform packages
        if: needs.release.outputs.native == 'true'
        run: pnpm napi pre-publish --no-gh-release --tagstyle npm --npm-dir npm

      - name: Build JS packages
        run: pnpm build:packages

      - name: Publish packages
        # The publish action runs `changeset publish` itself, pushes the tag, and
        # creates the GitHub release. Trusted publishing authenticates via OIDC.
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
