# CodeQL configuration for the napi class false positive.
#
# `rust/access-invalid-pointer` fires on `#[napi] pub struct` definitions:
# napi-derive expands the attribute into raw-pointer N-API glue and CodeQL
# anchors findings inside that expansion to the struct line. This repository
# contains no hand-written `unsafe` code; the alert is the macro expansion, not
# a dereference in our source. Rust does not yet support inline
# `// codeql[...]` suppression, so this filter is the narrowest available
# exclusion.
#
# Default setup: set the `github-codeql-config-file` repository property to
# `.github/codeql/codeql-config.yml`. Existing alerts must be dismissed once;
# the filter does not retroactively close them.
name: pingora CodeQL config
disable-default-queries: false
query-filters:
  - exclude:
      id: rust/access-invalid-pointer
