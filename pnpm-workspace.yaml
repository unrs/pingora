packages:
  - .
  - packages/*

allowBuilds:
  esbuild: true
  lefthook: true

# Platform packages are published by this repository's release workflow and
# must be installable immediately after they appear on the registry.
minimumReleaseAgeExclude:
  - '@pingora/binding-*'
  - '@nestjs/common@12.3.3'
  - '@nestjs/core@12.3.3'
  - '@nestjs/platform-express@12.3.3'

# Dependencies are installed explicitly; `pnpm run` should not re-verify them.
verifyDepsBeforeRun: false
