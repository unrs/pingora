[package]
name = "pingora-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/unrs/pingora"
description = "Node.js binding for Cloudflare Pingora, built with napi-rs"
keywords = ["pingora", "proxy", "napi", "napi-rs", "reverse-proxy"]
categories = ["network-programming", "api-bindings"]

[lib]
crate-type = ["cdylib"]

[dependencies]
async-trait = "0.1"
bytes = "1"
env_logger = "0.11"
http = "1"
log = "0.4"
napi = { version = "3.14", default-features = false, features = ["napi4", "async", "dyn-symbols"] }
napi-derive = "3.6"
pingora = { version = "0.9", features = ["proxy", "rustls"] }
rustls-pemfile = "2"
x509-parser = "0.16"
tokio = { version = "1", features = ["sync", "time"] }

[build-dependencies]
napi-build = "2.6"

[profile.release]
lto = "thin"
strip = "symbols"
