# yaml-language-server: $schema=https://lefthook.dev/schema.json

pre-commit:
  parallel: true
  jobs:
    - name: rustfmt
      glob: '*.rs'
      run: cargo fmt --all -- --check
    - name: clippy
      glob: '*.rs'
      run: cargo clippy --all-targets -- -D warnings

pre-push:
  jobs:
    - name: check
      run: just check
