name: pingora-server-bench

x-app: &app
  image: pingora-server-bench
  environment:
    PORT: 8080
  cpus: ${BENCH_SERVER_CPUS:-1}
  mem_limit: ${BENCH_SERVER_MEMORY:-512m}
  init: true

services:
  http-server:
    <<: *app
    build:
      context: ../..
      dockerfile: bench/server/Dockerfile
    ports:
      - "127.0.0.1:18107:8080"
    command: ["npx", "tsx", "bench/server/apps/http-server.ts"]

  node:
    <<: *app
    image: pingora-server-bench
    ports:
      - "127.0.0.1:18100:8080"
    command: ["npx", "tsx", "bench/server/apps/node.ts"]

  express:
    <<: *app
    ports:
      - "127.0.0.1:18101:8080"
    command: ["npx", "tsx", "bench/server/apps/express.ts"]

  fastify:
    <<: *app
    ports:
      - "127.0.0.1:18102:8080"
    command: ["npx", "tsx", "bench/server/apps/fastify.ts"]

  koa:
    <<: *app
    ports:
      - "127.0.0.1:18103:8080"
    command: ["npx", "tsx", "bench/server/apps/koa.ts"]

  nestjs:
    <<: *app
    ports:
      - "127.0.0.1:18104:8080"
    command: ["npx", "tsx", "bench/server/apps/nestjs.ts"]

  hono:
    <<: *app
    ports:
      - "127.0.0.1:18105:8080"
    command: ["npx", "tsx", "bench/server/apps/hono.ts"]

  elysia:
    <<: *app
    ports:
      - "127.0.0.1:18106:8080"
    command: ["npx", "tsx", "bench/server/apps/elysia.ts"]

  loadgen:
    build: ../native/loadgen
    profiles: ["tools"]
