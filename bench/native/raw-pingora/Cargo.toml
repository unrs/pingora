[package]
name = "raw-pingora"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
async-trait = "0.1"
# tokio 1.54 triggers cloudflare/pingora#1059; keep the binding lockstep.
pingora = { version = "=0.9.0", features = ["proxy", "rustls"] }
tokio = "=1.53.3"

[profile.release]
lto = "thin"
strip = "symbols"
