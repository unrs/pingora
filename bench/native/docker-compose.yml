services:
  origin:
    build: ./origin
    environment:
      ORIGIN_READ_PER_REQUEST: ${ORIGIN_READ_PER_REQUEST:-0}
    ports:
      - "127.0.0.1:18080:8080"

  pingora:
    build:
      context: ../..
      dockerfile: bench/native/pingora.Dockerfile
      args:
        BINDING: pingora-full.node
    depends_on:
      - origin
    environment:
      ORIGIN_HOST: origin
      ORIGIN_PORT: 8080
      THREADS: 4
      PORT: 8085
    ports:
      - "127.0.0.1:18085:8085"

  pingora-minimal:
    build:
      context: ../..
      dockerfile: bench/native/pingora.Dockerfile
      args:
        BINDING: pingora-minimal.node
    depends_on:
      - origin
    environment:
      ORIGIN_HOST: origin
      ORIGIN_PORT: 8080
      THREADS: 4
      PORT: 8086
    ports:
      - "127.0.0.1:18086:8086"

  nginx:
    image: nginx:1.27.5-alpine
    depends_on:
      - origin
    ports:
      - "127.0.0.1:18081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  caddy:
    image: caddy:2.9.1-alpine
    depends_on:
      - origin
    ports:
      - "127.0.0.1:18082:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  openresty:
    image: openresty/openresty:1.27.1.1-alpine
    depends_on:
      - origin
    ports:
      - "127.0.0.1:18083:80"
    volumes:
      - ./openresty.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro

  haproxy:
    image: haproxy:3.0.5-alpine
    depends_on:
      - origin
    ports:
      - "127.0.0.1:18084:80"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
